  <!-- Application Structure Plan: Conception d'un tableau de bord interactif. La structure est centrée sur un panneau de filtres (par niveau, type, thème) et une barre de recherche, permettant aux utilisateurs de trouver instantanément des ressources pertinentes. Les résultats s'affichent sous forme de cartes dans une grille réactive. Cette approche transforme une liste statique en un outil dynamique, optimisant l'expérience utilisateur pour les élèves et enseignants qui cherchent un contenu ciblé. Le flux est simple : filtrer -> explorer -> cliquer. -->
  <!-- Visualization & Content Choices: Les données (liste de ressources) sont présentées via une grille de cartes HTML/CSS. L'objectif est d'organiser et d'informer. L'interaction principale est le filtrage et la recherche en direct via JavaScript, qui met à jour la grille de cartes. Des compteurs dynamiques affichent le nombre de ressources visibles pour donner un retour immédiat à l'utilisateur. Ce système est plus efficace qu'un graphique pour ce type de données, car l'objectif est la découverte de liens spécifiques plutôt que l'analyse de tendances quantitatives. La méthode est purement HTML/CSS et JavaScript. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    .card {
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      border: 1px solid #e2e8f0;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    .tag {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .filter-container {
      position: sticky;
      top: 0;
      background-color: #f8fafc;
      z-index: 10;
      padding-top: 1.5rem;
      padding-bottom: 1rem;
    }
  </style>
</head>

      'Orientation': 'bg-lime-100 text-lime-800',
      'Événement': 'bg-fuchsia-100 text-fuchsia-800',
      'Manuel scolaire': 'bg-yellow-100 text-yellow-800'
    };

    function populateTypeFilter() {
      const types = [...new Set(resources.map(r => r.type))];
      types.sort();
      types.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        typeFilter.appendChild(option);
      });
    }

    function renderResources() {
      grid.innerHTML = '';
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedLevel = levelFilter.value;
      const selectedType = typeFilter.value;

      const filteredResources = resources.filter(resource => {
        const matchesSearch = searchTerm === '' ||
          resource.nom.toLowerCase().includes(searchTerm) ||
          resource.description.toLowerCase().includes(searchTerm) ||
          resource.motsCles.some(kw => kw.toLowerCase().includes(searchTerm));

        const matchesLevel = selectedLevel === 'all' || resource.niveau === selectedLevel || resource.niveau === 'Les deux';

        const matchesType = selectedType === 'all' || resource.type === selectedType;

        return matchesSearch && matchesLevel && matchesType;
      });

      countSpan.textContent = filteredResources.length;

      if (filteredResources.length === 0) {
        grid.innerHTML = `<p class="text-slate-500 col-span-full text-center">Aucune ressource ne correspond à vos critères.</p>`;
        return;
      }

      filteredResources.forEach(resource => {
        const card = document.createElement('div');
        card.className = 'card bg-white p-6 rounded-lg shadow-sm flex flex-col';

        const themesHtml = resource.themes.map(theme => `<span class="tag bg-slate-100 text-slate-700">${theme}</span>`).join(' ');

        card.innerHTML = `
              <div class="flex-grow">
                <div class="flex justify-between items-start mb-2">
                  <span class="tag ${typeColors[resource.type] || 'bg-gray-100 text-gray-800'}">${resource.type}</span>
                  <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded-full">${resource.niveau}</span>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">${resource.nom}</h3>
                <p class="text-slate-600 text-sm mb-4">${resource.description}</p>
              </div>
              <div class="mt-auto">
                <div class="flex flex-wrap gap-2 mb-4">
                  ${themesHtml}
                </div>
                <a href="${resource.lien}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                  Visiter →
                </a>
              </div>
              `;
        grid.appendChild(card);
      });
    }

    function resetFilters() {
      searchInput.value = '';
      levelFilter.value = 'all';
      typeFilter.value = 'all';
      renderResources();
    }

    searchInput.addEventListener('input', renderResources);
    levelFilter.addEventListener('change', renderResources);
    typeFilter.addEventListener('change', renderResources);
    resetBtn.addEventListener('click', resetFilters);

    document.addEventListener('DOMContentLoaded', () => {
      populateTypeFilter();
      renderResources();
    });
  </script>
</body>

</html>
