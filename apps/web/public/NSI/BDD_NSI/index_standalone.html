      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = filename;
      anchor.click();
    };
    const parseCSV = (text) => {
      const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(Boolean);
      if (!lines.length) return { rows: [], sep: ',' };
      const headerLine = lines[0];
      const comma = (headerLine.match(/,/g) || []).length;
      const semi = (headerLine.match(/;/g) || []).length;
      const sep = semi > comma ? ';' : ',';
      const rows = lines.map(line =>
        line.split(sep).map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
      );
      return { rows, sep };
    };
    const sanitizeName = (name) =>
      String(name || '').toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/__+/g, '_').replace(/^_+|_+$/g, '');
    const normalizeHeaders = (headers) => {
      const seen = new Set();
      return headers.map((header, index) => {
        const fallback = `col_${index + 1}`;
        const base = sanitizeName(header) || fallback;
        let candidate = base;
        let suffix = 2;
        while (seen.has(candidate)) {
          candidate = `${base}_${suffix}`;
          suffix += 1;
        }
        seen.add(candidate);
        return candidate;
      });
    };
    const copyToClipboard = async (payload) => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(payload);
          return true;
        }
        const textarea = document.createElement('textarea');
        textarea.value = payload;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'absolute';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);
        return success;
      } catch (error) {
        console.warn('Clipboard non disponible', error);
        return false;
      }
    };

    const SharedState = (() => {
      const storageKeys = {
        role: 'nsi_bdd_role',
        dataset: 'nsi_bdd_dataset',
        solutions: 'nsi_bdd_show_solutions'
      };

      const defaultDataset = () => datasetCatalog[0]?.key || 'bibliotheque';

      const isValidRole = (value) => value === 'eleve' || value === 'enseignant';

      const normalizeDataset = (value) => {
        if (!value) return defaultDataset();
        return datasetCatalog.some((entry) => entry.key === value) ? value : defaultDataset();
      };

      const toSolutionToken = (flag) => (flag ? 'on' : 'off');

      const fromSolutionToken = (token, fallback) => {
        if (token === 'on') return true;
        if (token === 'off') return false;
        return fallback;
      };

      const persist = (state) => {
        if (typeof window === 'undefined') return;
        try {
          localStorage.setItem(storageKeys.role, state.role);
          localStorage.setItem(storageKeys.dataset, state.dataset);
          localStorage.setItem(storageKeys.solutions, toSolutionToken(state.showSolutions));
        } catch (error) {
          console.warn('Impossible d’enregistrer l’état partagé', error);
        }
      };

      const syncUrl = (state) => {
        if (typeof window === 'undefined' || typeof window.history === 'undefined') return;
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('role', state.role);
          url.searchParams.set('dataset', state.dataset);
          url.searchParams.set('solutions', toSolutionToken(state.showSolutions));
          window.history.replaceState({}, '', url.toString());
        } catch (error) {
          console.warn('Impossible de synchroniser l’URL', error);
        }
      };

      const initialize = () => {
        const fallbacks = { role: 'eleve', dataset: defaultDataset(), showSolutions: false };
        if (typeof window === 'undefined') {
          return fallbacks;
        }
        try {
          const url = new URL(window.location.href);
          const getFromSources = (paramName, storageKey, fallback) => {
            const urlValue = url.searchParams.get(paramName);
            if (urlValue !== null && urlValue !== undefined && urlValue !== '') {
              return urlValue;
            }
            const stored = localStorage.getItem(storageKey);
            if (stored !== null && stored !== undefined && stored !== '') {
              return stored;
            }
            return fallback;
          };

          const rawRole = getFromSources('role', storageKeys.role, fallbacks.role);
          const role = isValidRole(rawRole) ? rawRole : fallbacks.role;
          const rawDataset = getFromSources('dataset', storageKeys.dataset, fallbacks.dataset);
          const dataset = normalizeDataset(rawDataset);
          const rawSolutions = getFromSources('solutions', storageKeys.solutions, role === 'enseignant' ? 'on' : 'off');
          const showSolutions = fromSolutionToken(rawSolutions, role === 'enseignant');

          const resolved = { role, dataset, showSolutions };
          persist(resolved);
          syncUrl(resolved);
          return resolved;
        } catch (error) {
          console.warn('Initialisation de l’état partagé impossible', error);
          return fallbacks;
        }
      };

      const toStudentUrl = (state) => {
        if (typeof window === 'undefined') return '';
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('role', 'eleve');
          url.searchParams.set('dataset', state.dataset);
          url.searchParams.set('solutions', 'off');
          return url.toString();
        } catch (error) {
          console.warn('Impossible de composer l’URL élève', error);
          return '';
        }
      };

      return {
        storageKeys,
        initialize,
        persist,
        syncUrl,
        toStudentUrl,
        normalizeDataset,
        toSolutionToken,
        fromSolutionToken
      };
    })();

    /* ---------- playground ---------- */
    const Playground = ({ onQueryExecuted = () => {}, loggingEnabled = false }) => {
      const [sql, setSql] = useState(`-- CONSEIL : démarrez par SELECT * FROM nom_de_table LIMIT 5;
SELECT 1 AS prêt;`);
      const [columns, setColumns] = useState([]);
      const [rows, setRows] = useState([]);
      const [messages, setMessages] = useState([]);
      const [tables, setTables] = useState([]);
      const messageRef = useRef(null);

      const pushMessage = (payload) => {
        setMessages((prev) => [payload, ...prev].slice(0, 6));
      };

      const refreshTables = () => {
        try {
          const data = alasql('SHOW TABLES');
          setTables(data);
        } catch (error) {
          console.error('SHOW TABLES', error);
        }
      };

      useEffect(() => {
        refreshTables();
      }, []);

      useEffect(() => {
        if (messageRef.current) {
          messageRef.current.focus({ preventScroll: false });
        }
      }, [messages]);

      const runQuery = () => {
        try {
          const trimmed = sql.trim();
          const result = alasql(trimmed || 'SELECT 1');
          const last = Array.isArray(result) ? result[result.length - 1] : result;
          const data = Array.isArray(last) ? last : (last !== undefined ? [last] : []);
          const cols = data.length ? Object.keys(data[0]) : [];
          setColumns(cols);
          setRows(data);
          pushMessage({ type: 'success', content: 'Requête exécutée avec succès.' });
          refreshTables();
          if (loggingEnabled) {
            onQueryExecuted({
              type: 'query',
              status: 'success',
              sql: trimmed,
              rows: Array.isArray(data) ? data.length : 0,
              timestamp: new Date().toISOString()
            });
          }
        } catch (error) {
          pushMessage({ type: 'error', content: `Erreur SQL : ${error.message}` });
          if (loggingEnabled) {
            onQueryExecuted({
              type: 'query',
              status: 'error',
              sql: sql.trim(),
              message: error.message,
              timestamp: new Date().toISOString()
            });
          }
        }
      };

      const resetDatabase = () => {
        try {
          const list = alasql('SHOW TABLES');
          list.forEach((entry) => {
            try {
              alasql(`DROP TABLE ${entry.tableid}`);
            } catch (error) {
              console.warn('DROP TABLE', error);
            }
          });
          setColumns([]);
          setRows([]);
          refreshTables();
          pushMessage({ type: 'success', content: 'Base réinitialisée. Vous pouvez importer un CSV.' });
          if (loggingEnabled) {
            onQueryExecuted({
              type: 'reset',
              status: 'success',
              timestamp: new Date().toISOString()
            });
          }
        } catch (error) {
          pushMessage({ type: 'error', content: `Reset impossible : ${error.message}` });
          if (loggingEnabled) {
            onQueryExecuted({
              type: 'reset',
              status: 'error',
              message: error.message,
              timestamp: new Date().toISOString()
            });
          }
        }
      };

      const importCSV = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result);
          const { rows } = parseCSV(text);
          if (!rows.length) {
            pushMessage({ type: 'error', content: 'Le fichier semble vide.' });
            return;
          }
          const rawHeaders = rows[0] || [];
          const headers = normalizeHeaders(rawHeaders);
          const rawName = sanitizeName(file.name.replace(/\.[^.]+$/, ''));
          const tableName = rawName || 'table';
          try {
            alasql(`DROP TABLE IF EXISTS ${tableName}`);
            alasql(`CREATE TABLE ${tableName} (${headers.map((h) => `${h} TEXT`).join(', ')})`);
            const stmt = alasql.compile(`INSERT INTO ${tableName} VALUES (${headers.map(() => '?').join(', ')})`);
            rows.slice(1).forEach((row) => {
              const padded = headers.map((_, index) => row[index] ?? null);
              stmt(padded);
            });
            setSql(`SELECT * FROM ${tableName} LIMIT 10;`);
            refreshTables();
            pushMessage({
              type: 'success',
              content: `Table “${tableName}” importée (${rows.length - 1} lignes).`
            });
            if (loggingEnabled) {
              onQueryExecuted({
                type: 'import',
                status: 'success',
                table: tableName,
                rows: rows.length - 1,
                timestamp: new Date().toISOString()
              });
            }
          } catch (error) {
            pushMessage({ type: 'error', content: `Import impossible : ${error.message}` });
            if (loggingEnabled) {
              onQueryExecuted({
                type: 'import',
                status: 'error',
                table: tableName,
                message: error.message,
                timestamp: new Date().toISOString()
              });
            }
          }
        };
        reader.readAsText(file, 'utf-8');
      };

      const messageTone = {
        success: 'border-emerald-500/40 bg-emerald-500/10 text-emerald-50',
        error: 'border-rose-500/40 bg-rose-500/10 text-rose-100',
        info: 'border-slate-400/40 bg-slate-400/10 text-slate-50'
      };

      return (
        <div className="grid gap-6 lg:grid-cols-[minmax(0,2fr),minmax(0,1fr)]">
          <div className="flex flex-col gap-4 rounded-3xl border border-white/10 bg-slate-900/60 p-6 shadow-xl shadow-black/40">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="text-2xl font-semibold text-white">Playground SQL exécutable</h3>
                <p className="text-sm text-slate-300">
                  Compatible SQLite/PostgreSQL (fonctions de fenêtre limitées). Vous pouvez importer vos données CSV.
                </p>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={runQuery}
                  className="inline-flex items-center gap-2 rounded-2xl border border-nexus-400 bg-nexus-500/80 px-4 py-2 text-sm font-semibold text-white shadow-lg transition hover:bg-nexus-500 focus:outline-none focus:ring-2 focus:ring-nexus-300"
                >
                  ▶ Exécuter
                </button>
                <button
                  onClick={resetDatabase}
                  className="inline-flex items-center gap-2 rounded-2xl border border-white/15 bg-white/10 px-4 py-2 text-sm font-semibold text-white/80 transition hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-slate-200/40"
                >
                  🗄️ Réinitialiser
                </button>
              </div>
            </div>

            <label className="flex flex-col gap-2 text-sm text-slate-200">
              Requête SQL
              <textarea
                value={sql}
                onChange={(event) => setSql(event.target.value)}
                onKeyDown={(event) => {
                  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
                    event.preventDefault();
                    runQuery();
                  }
                }}
                className="min-h-[220px] w-full rounded-2xl border border-white/10 bg-slate-950/80 p-4 font-mono text-sm text-slate-100 shadow-inner focus:border-nexus-400 focus:outline-none focus:ring-2 focus:ring-nexus-300/60"
              />
            </label>

            <div
              ref={messageRef}
              tabIndex={-1}
              aria-live="polite"
              className="flex flex-col gap-2"
            >

    const TeacherExecutor = ({ selectedDataset }) => {
      const [script, setScript] = useState(e2eSnippets[selectedDataset] || '');
      const [logs, setLogs] = useState([]);
      const [resultColumns, setResultColumns] = useState([]);
      const [resultRows, setResultRows] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const dbRef = useRef(() => new alasql.Database());

      useEffect(() => {
        setScript(e2eSnippets[selectedDataset] || '');
      }, [selectedDataset]);

      const pushLog = (entry) => {
        setLogs((prev) => [
          { ...entry, timestamp: new Date().toISOString() },
          ...prev
        ].slice(0, 15));
      };

      const currentDb = () => {
        if (typeof dbRef.current === 'function') {
          dbRef.current = new alasql.Database();
        }
        if (!dbRef.current) {
          dbRef.current = new alasql.Database();
        }
        return dbRef.current;
      };

      const resetDatabase = () => {
        dbRef.current = new alasql.Database();
        setResultColumns([]);
        setResultRows([]);
        pushLog({ status: 'info', message: 'Nouvelle base initialisée.' });
      };

      const loadDataset = async () => {
        const theme = datasetCatalog.find((entry) => entry.key === selectedDataset);
        if (!theme) {
          pushLog({ status: 'error', message: 'Dataset introuvable pour ce thème.' });
          return;
        }
        if (!Array.isArray(theme.csv) || !theme.csv.length) {
          pushLog({ status: 'warning', message: 'Aucun CSV associé à ce dataset.' });
        }
        setIsLoading(true);
        try {
          const db = new alasql.Database();
          for (const href of theme.csv || []) {
            const response = await fetch(href);
            if (!response.ok) {
              throw new Error(`Impossible de récupérer ${href} (${response.status})`);
            }
            const text = await response.text();
            const { rows } = parseCSV(text);
            if (!rows.length) {
              pushLog({ status: 'warning', message: `Fichier vide ignoré : ${href}` });
              continue;
            }
            const headers = normalizeHeaders(rows[0]);
            const tableName = sanitizeName(href.split('/').pop().replace(/\.[^.]+$/, '')) || 'table';
            db.exec(`DROP TABLE IF EXISTS ${tableName}`);
            db.exec(`CREATE TABLE ${tableName} (${headers.map((h) => `${h} TEXT`).join(', ')})`);
            const table = db.tables[tableName];
            rows.slice(1).forEach((row) => {
              const record = {};
              headers.forEach((header, index) => {
                record[header] = row[index] ?? null;
              });
              table.data.push(record);
            });
            pushLog({ status: 'success', message: `${tableName} importée (${rows.length - 1} lignes).` });
          }
          dbRef.current = db;
          setResultColumns([]);
          setResultRows([]);
          pushLog({ status: 'info', message: 'Dataset chargé — exécutez les contrôles ci-dessous.' });
        } catch (error) {
          pushLog({ status: 'error', message: error.message });
        } finally {
          setIsLoading(false);
        }
      };

      const importLocalCSV = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = String(reader.result);
            const { rows } = parseCSV(text);
            if (!rows.length) {
              pushLog({ status: 'error', message: 'Le fichier local semble vide.' });
              return;
            }
            const headers = normalizeHeaders(rows[0]);
            const tableName = sanitizeName(file.name.replace(/\.[^.]+$/, '')) || 'table_local';
            const db = currentDb();
            db.exec(`DROP TABLE IF EXISTS ${tableName}`);
            db.exec(`CREATE TABLE ${tableName} (${headers.map((h) => `${h} TEXT`).join(', ')})`);
            const table = db.tables[tableName];
            rows.slice(1).forEach((row) => {
              const record = {};
              headers.forEach((header, index) => {
                record[header] = row[index] ?? null;
              });
              table.data.push(record);
            });
            pushLog({ status: 'success', message: `Import local réussi : ${tableName} (${rows.length - 1} lignes).` });
          } catch (error) {
            pushLog({ status: 'error', message: error.message });
          }
        };
        reader.readAsText(file, 'utf-8');
      };

      const runScript = () => {
        const db = currentDb();
        setResultColumns([]);
        setResultRows([]);
        if (!script.trim()) {
          pushLog({ status: 'warning', message: 'Aucun script à exécuter.' });
          return;
        }
        const statements = script
          .split(/;\s*(?:\n|$)/)
          .map((stmt) => stmt.trim())
          .filter(Boolean);

        if (!statements.length) {
          pushLog({ status: 'warning', message: 'Script vide après nettoyage.' });
          return;
        }

        for (const statement of statements) {
          if (!statement || statement.startsWith('--')) {
            continue;
          }
          try {
            const result = db.exec(statement);
            if (Array.isArray(result) && result.length) {
              if (typeof result[0] === 'object') {
                setResultColumns(Object.keys(result[0]));
                setResultRows(result.slice(0, 10));
              } else {
                setResultColumns(['valeur']);
                setResultRows(result.slice(0, 10).map((value) => ({ valeur: value })));
              }
              pushLog({ status: 'success', message: `SELECT exécuté (${result.length} ligne(s)).` });
            } else {
              pushLog({ status: 'success', message: `Instruction exécutée : ${statement.substring(0, 60)}…` });
            }
          } catch (error) {
            pushLog({ status: 'error', message: `Erreur sur « ${statement.substring(0, 60)}… » : ${error.message}` });
            break;
          }
        }
      };

      return (
        <section className="relative z-10 mx-auto mt-4 max-w-6xl px-6 sm:px-8 lg:px-10">
          <SectionShell
            id="enseignant-execution"
            kicker="Contrôles de cohérence"
            title="Exécuter un script SQL local (AlaSQL)"
            note="Chargez un dataset, collez un script E2E (DROP→CREATE→INSERT→CHECK) puis exécutez-le hors-ligne."
          >
            <div className="grid gap-6 lg:grid-cols-[2fr,1fr]">
              <div className="flex flex-col gap-4 rounded-3xl border border-white/10 bg-slate-900/60 p-6">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h3 className="text-lg font-semibold text-white">Script SQL</h3>
                  <div className="flex flex-wrap gap-2 text-xs">
                    <button
                      onClick={() => setScript(e2eSnippets[selectedDataset] || '')}
                      className="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1 font-semibold text-white/80 transition hover:bg-white/20"
                    >
                      Charger le modèle
                    </button>
                    <button
                      onClick={resetDatabase}
                      className="inline-flex items-center gap-2 rounded-full border border-rose-400/40 bg-rose-500/15 px-3 py-1 font-semibold text-rose-100 transition hover:bg-rose-500/25"
                    >
                      Réinitialiser la base
                    </button>
                  </div>
                </div>
                <textarea
                  value={script}
                  onChange={(event) => setScript(event.target.value)}
                  className="min-h-[220px] w-full rounded-2xl border border-white/10 bg-slate-950/80 p-4 font-mono text-sm text-slate-100 shadow-inner focus:border-nexus-400 focus:outline-none focus:ring-2 focus:ring-nexus-300/60"
                />
                <div className="flex flex-wrap gap-2 text-sm">
                  <button
                    onClick={runScript}
                    className="inline-flex items-center gap-2 rounded-2xl border border-nexus-400 bg-nexus-500/80 px-4 py-2 font-semibold text-white shadow-lg transition hover:bg-nexus-500"
                  >
                    ▶ Exécuter le script
                  </button>
                  <button
                    onClick={loadDataset}
                    className="inline-flex items-center gap-2 rounded-2xl border border-white/15 bg-white/10 px-4 py-2 font-semibold text-white/80 transition hover:bg-white/20"
                    disabled={isLoading}
                  >
                    {isLoading ? 'Chargement…' : 'Charger le dataset sélectionné'}
                  </button>
                  <label className="inline-flex items-center gap-2 rounded-2xl border border-white/15 bg-white/5 px-3 py-1 text-xs text-slate-300 hover:bg-white/10">
                    CSV local
                    <input
                      type="file"
                      accept=".csv,text/csv"
                      onChange={(event) => importLocalCSV(event.target.files[0])}
                      className="hidden"
                    />
                  </label>
                </div>
                <div className="overflow-x-auto rounded-2xl border border-white/10 bg-black/30">
                  <table className="min-w-full text-left text-sm text-slate-200">
                    <thead className="bg-white/5 text-xs uppercase tracking-wide text-slate-300">
                      <tr>
                        {resultColumns.map((column) => (
                          <th key={column} className="px-3 py-2">{column}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {resultRows.length ? (
                        resultRows.map((row, rowIndex) => (
                          <tr key={rowIndex} className={rowIndex % 2 ? 'bg-white/5' : undefined}>
                            {resultColumns.map((column) => (
                              <td key={column} className="px-3 py-2 text-xs text-slate-100/80 break-all">
                                {row[column] !== undefined ? String(row[column]) : '—'}
                              </td>
                            ))}
                          </tr>
                        ))
                      ) : (
                        <tr>
                          <td colSpan={resultColumns.length || 1} className="px-3 py-4 text-center text-xs text-slate-500">
                            Les résultats des SELECT apparaîtront ici (limités à 10 lignes).
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
              <aside className="flex flex-col gap-3 rounded-3xl border border-white/10 bg-slate-900/60 p-6 text-xs text-slate-300">
                <h3 className="text-sm font-semibold text-white">Journal d’exécution</h3>
                <ul className="space-y-2">
                  {logs.length ? logs.map((entry, index) => (
                    <li key={index} className={clsx(
                      'rounded-2xl border px-3 py-2',
                      entry.status === 'error' ? 'border-rose-400/40 bg-rose-500/10 text-rose-100' :
                        entry.status === 'warning' ? 'border-amber-400/40 bg-amber-500/10 text-amber-100' :
                          'border-white/10 bg-white/5 text-slate-200'
                    )}>
                      <div className="font-mono text-[10px] text-slate-400">{entry.timestamp}</div>
                      <div className="text-xs leading-snug">{entry.message}</div>
                    </li>
                  )) : (
                    <li className="rounded-2xl border border-white/10 bg-white/5 px-3 py-4 text-center text-slate-400">
                      Aucune exécution enregistrée pour l’instant.
                    </li>
                  )}
                </ul>
                <p className="mt-auto text-[11px] text-slate-400">
                  Astuce : après avoir chargé un dataset, ajustez le script (ou utilisez le modèle) pour lancer vos propres contrôles d’intégrité, anti-joins et indicateurs.
                </p>
              </aside>
            </div>
          </SectionShell>
        </section>
      );
    };

    const TeacherJournalPanel = ({ journal, onExport, onClear, loggingEnabled, healthQueries }) => (
      <section className="relative z-10 mx-auto mt-4 max-w-6xl px-6 pb-16 sm:px-8 lg:px-10">
        <SectionShell
          id="enseignant-journal"
          kicker="Suivi local"
          title="Journal des requêtes (hors ligne)"
          note="Les entrées sont stockées uniquement dans le navigateur courant. Exportez-les pour analyser la séance ou préparez la suivante."
        >
          <div className="grid gap-6 lg:grid-cols-[2fr,1fr]">
            <div className="rounded-3xl border border-white/10 bg-slate-900/60 p-6 text-sm text-slate-200">
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-semibold text-white">{journal.length} entrées enregistrées</h3>
                <Pill tone={loggingEnabled ? 'success' : 'warning'}>{loggingEnabled ? 'Collecte active' : 'Collecte inactive'}</Pill>
              </div>
              <div className="mt-3 overflow-x-auto">
                <table className="min-w-full text-left text-xs text-slate-300">
                  <thead className="border-b border-white/10 text-[11px] uppercase tracking-wide text-slate-400">
                    <tr>
                      <th className="px-3 py-2">Horodatage</th>
                      <th className="px-3 py-2">Type</th>
                      <th className="px-3 py-2">Statut</th>
                      <th className="px-3 py-2">Détail</th>
                    </tr>
                  </thead>
                  <tbody>
                    {journal.slice(-10).reverse().map((entry, index) => (
                      <tr key={index} className={index % 2 ? 'bg-white/5' : undefined}>
                        <td className="px-3 py-2 font-mono text-[11px] text-slate-200">{entry.timestamp}</td>
                        <td className="px-3 py-2 uppercase tracking-wide text-[11px]">{entry.type}</td>
                        <td className={clsx('px-3 py-2 text-[11px]', entry.status === 'success' ? 'text-emerald-300' : 'text-rose-300')}>
                          {entry.status || '—'}
                        </td>
                        <td className="px-3 py-2 text-[11px] text-slate-300 break-all">
                          {entry.sql || entry.message || entry.table || '—'}
                        </td>
                      </tr>
                    ))}
                    {!journal.length && (
                      <tr>
                        <td colSpan={4} className="px-3 py-4 text-center text-[11px] text-slate-500">
                          Aucune entrée pour l’instant. Activez la collecte ou demandez aux élèves d’exécuter une requête.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
              <div className="mt-4 flex flex-wrap gap-2 text-xs">
                <button
                  onClick={onExport}
                  className="inline-flex items-center gap-2 rounded-2xl border border-white/15 bg-white/10 px-4 py-2 font-semibold text-white/80 transition hover:bg-white/20"
                >
                  Exporter le journal (.json)
                </button>
                <button
                  onClick={onClear}
                  className="inline-flex items-center gap-2 rounded-2xl border border-rose-400/40 bg-rose-500/15 px-4 py-2 font-semibold text-rose-100 transition hover:bg-rose-500/25"
                >
                  Réinitialiser
                </button>
              </div>
            </div>
            <aside className="flex flex-col gap-3 rounded-3xl border border-white/10 bg-slate-900/60 p-6 text-xs text-slate-300">
              <h3 className="text-sm font-semibold text-white">Requêtes de contrôle à exécuter</h3>
              {healthQueries?.length ? (
                <ol className="list-decimal space-y-2 pl-5 text-[11px]">
                  {healthQueries.map((query, index) => (
                    <li key={index} className="break-words text-[11px] text-slate-200">
                      <code>{query}</code>
                    </li>
                  ))}
                </ol>
              ) : (
                <p>Aucune requête sélectionnée pour le moment.</p>
              )}
              <p className="mt-2 text-[11px] text-slate-400">
                Conseil : lancez ces requêtes dans un SGBD réel (SQLite ou PostgreSQL) après import pour vérifier l’intégrité des données.
              </p>
            </aside>
          </div>
        </SectionShell>
      </section>
    );

    const AudienceSwitcher = ({ role, onRoleChange, journalCount, showSolutions, dataset }) => {
      const currentDataset = datasetCatalog.find((entry) => entry.key === dataset)?.label || datasetCatalog[0]?.label || 'Bibliothèque';
      return (
        <div className="relative z-30 flex justify-center px-6 pt-8 sm:px-8 lg:px-10">
          <div className="flex w-full max-w-4xl flex-wrap items-center justify-between gap-4 rounded-3xl border border-white/10 bg-slate-900/70 px-6 py-4 text-sm text-slate-200 shadow-glow backdrop-blur">
            <div className="flex flex-col">
              <span className="text-xs uppercase tracking-wide text-slate-400">Interface affichée</span>
              <span className="text-sm font-semibold text-white">{role === 'enseignant' ? 'Espace enseignant' : 'Espace élève'}</span>
              <span className="text-[11px] text-slate-400">Dataset chargé : <strong className="text-slate-200">{currentDataset}</strong></span>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => onRoleChange('eleve')}
                className={clsx(
                  'inline-flex items-center gap-2 rounded-full border px-4 py-2 text-xs font-semibold transition',
                  role === 'eleve'
                    ? 'border-nexus-400/60 bg-nexus-500/50 text-white shadow-glow'
                    : 'border-white/15 bg-white/10 text-white/80 hover:bg-white/20',
                  focusRing
                )}
              >
                Espace élève
              </button>
              <button
                onClick={() => onRoleChange('enseignant')}
                className={clsx(
                  'inline-flex items-center gap-2 rounded-full border px-4 py-2 text-xs font-semibold transition',
                  role === 'enseignant'
                    ? 'border-emerald-400/60 bg-emerald-500/40 text-white shadow-glow'
                    : 'border-white/15 bg-white/10 text-white/80 hover:bg-white/20',
                  focusRing
                )}
              >
                Espace enseignant
              </button>
            </div>
            <div className="flex flex-wrap items-center gap-4 text-xs text-slate-300">
              <span>
                Solutions :{' '}
                <strong className={showSolutions ? 'text-emerald-300' : 'text-slate-100/80'}>
                  {showSolutions ? 'activées' : 'masquées'}
                </strong>
              </span>
              <span>Journal : {journalCount}</span>
            </div>
          </div>
        </div>
      );
    };

    const TeacherApp = ({
      showSolutions,
      onShowSolutionsChange,
      loggingEnabled,
      setLoggingEnabled,
      journal,
      setJournal,
      solutionOverrides,
      setSolutionOverrides,
      isFileProtocol,
      activeDataset,
      onDatasetChange,
      sharedStateSnapshot
    }) => {
      const [datasetSource, setDatasetSource] = useState('fourni');
      const [healthQueries, setHealthQueries] = useState(healthCheckLibrary[activeDataset] || []);
      const [isPackaging, setIsPackaging] = useState(false);
      const [shareFeedback, setShareFeedback] = useState('');

      useEffect(() => {
        setHealthQueries(healthCheckLibrary[activeDataset] || []);
      }, [activeDataset]);

      useEffect(() => {
        if (!shareFeedback) return;
        const timer = setTimeout(() => setShareFeedback(''), 4000);
        return () => clearTimeout(timer);
      }, [shareFeedback]);

      const handleOverrideChange = (section, key, value) => {
        setSolutionOverrides((prev) => {
          const next = JSON.parse(JSON.stringify(prev || defaultSolutionOverrides));
          if (section === 'scenarios') {
            if (!next.scenarios) next.scenarios = {};
            next.scenarios[key] = value;
          } else if (section === 'projects') {
            next.projects = value;
          }
          return next;
        });
      };

      const handleGeneratePack = async () => {
        setIsPackaging(true);
        try {
          const blob = await PackBuilder.generate({ datasetKey: activeDataset, datasetSource });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `pack_eleve_${activeDataset}.zip`;
          link.click();
        } catch (error) {
          alert(`Création du pack impossible : ${error.message}`);
        } finally {
          setIsPackaging(false);
        }
      };

      const handleHealthCheck = () => {
        setHealthQueries(healthCheckLibrary[activeDataset] || []);
      };

      const handleExportJournal = () => {
        downloadText('journal_sql.json', JSON.stringify(journal, null, 2));
      };

      const handleClearJournal = () => {
        setJournal([]);
      };

      const handleShareLinkCopy = async () => {
        const url = SharedState.toStudentUrl(sharedStateSnapshot);
        if (!url) {
          setShareFeedback('Impossible de composer le lien élève.');
          return;
        }
        const ok = await copyToClipboard(url);
        setShareFeedback(ok ? 'Lien élève copié dans le presse-papiers.' : 'Copie impossible : sélectionnez le lien dans la barre d’adresse.');
      };

      return (
        <>
          <TeacherHero showSolutions={showSolutions} />
          <TeacherControlPanel
            showSolutions={showSolutions}
            onShowSolutionsChange={onShowSolutionsChange}
            loggingEnabled={loggingEnabled}
            setLoggingEnabled={setLoggingEnabled}
            datasetSource={datasetSource}
            setDatasetSource={setDatasetSource}
            selectedDataset={activeDataset}
            onDatasetChange={onDatasetChange}
            onGeneratePack={handleGeneratePack}
            onRunHealthCheck={handleHealthCheck}
            isPackaging={isPackaging}
            solutionOverrides={solutionOverrides}
            onOverrideChange={handleOverrideChange}
            isFileProtocol={isFileProtocol}
            onShareLinkCopy={handleShareLinkCopy}
            shareFeedback={shareFeedback}
          />
          <TeacherDatasets selectedDataset={activeDataset} />
          <TeacherExecutor selectedDataset={activeDataset} />
          <TeacherSessionsPlanner />
          <TeacherResourcesHub />
          <TeacherJournalPanel
            journal={journal}
            onExport={handleExportJournal}
            onClear={handleClearJournal}
            loggingEnabled={loggingEnabled}
            healthQueries={healthQueries}
          />
        </>
      );
    };

    /* ---------- Application root ---------- */
    const StandaloneApp = () => {
      const [sharedStateValue, setSharedStateValue] = useState(() => SharedState.initialize());
      const [loggingEnabled, setLoggingEnabled] = useState(false);
      const [journal, setJournal] = useState([]);
      const [solutionOverrides, setSolutionOverrides] = useState(() => JSON.parse(JSON.stringify(defaultSolutionOverrides)));
      const [isFileProtocol, setIsFileProtocol] = useState(false);

      useEffect(() => {
        setIsFileProtocol(typeof window !== 'undefined' && window.location.protocol === 'file:');
      }, []);

      useEffect(() => {
        try {
          const loggingKeys = ['nsi_bdd_logging_enabled', 'bdd_nsi_logging_enabled'];
          const storedLogging = loggingKeys.map((key) => localStorage.getItem(key)).find((value) => value !== null);
          if (storedLogging !== undefined && storedLogging !== null) {
            setLoggingEnabled(storedLogging === 'true');
          }

          const overrideKeys = ['nsi_bdd_solution_overrides', 'bdd_nsi_solution_overrides'];
          const storedOverrides = overrideKeys.map((key) => localStorage.getItem(key)).find((value) => value);
          if (storedOverrides) {
            const parsed = JSON.parse(storedOverrides);
            setSolutionOverrides((prev) => ({
              ...JSON.parse(JSON.stringify(defaultSolutionOverrides)),
              ...parsed,
              scenarios: {
                ...(defaultSolutionOverrides.scenarios || {}),
                ...(parsed?.scenarios || {})
              }
            }));
          }
        } catch (error) {
          console.warn('Impossible de restaurer les préférences avancées', error);
        }
      }, []);

      useEffect(() => {
        SharedState.persist(sharedStateValue);
        SharedState.syncUrl(sharedStateValue);
      }, [sharedStateValue]);

      useEffect(() => {
        try {
          localStorage.setItem('nsi_bdd_logging_enabled', String(loggingEnabled));
        } catch (error) {
          console.warn('Impossible d’enregistrer le journal', error);
        }
      }, [loggingEnabled]);

      useEffect(() => {
        try {
          localStorage.setItem('nsi_bdd_solution_overrides', JSON.stringify(solutionOverrides));
        } catch (error) {
          console.warn('Impossible d’enregistrer les overrides de solutions', error);
        }
      }, [solutionOverrides]);

      const handleJournalPush = (entry) => {
        setJournal((previous) => [...previous, entry]);
      };

      const handleRoleChange = (nextRole) => {
        setSharedStateValue((prev) => {
          const normalizedRole = nextRole === 'enseignant' ? 'enseignant' : 'eleve';
          const nextState = { ...prev, role: normalizedRole };
          if (normalizedRole === 'eleve') {
            nextState.showSolutions = false;
          }
          return nextState;
        });
      };

      const handleDatasetChange = (nextDataset) => {
        setSharedStateValue((prev) => ({
          ...prev,
          dataset: SharedState.normalizeDataset(nextDataset)
        }));
      };

      const handleShowSolutionsChange = (updater) => {
        setSharedStateValue((prev) => {
          const nextValue = typeof updater === 'function' ? !!updater(prev.showSolutions) : !!updater;
          return {
            ...prev,
            showSolutions: prev.role === 'eleve' ? false : nextValue
          };
        });
      };

      const scenarioOverrides = solutionOverrides?.scenarios || {};
      const projectOverride = solutionOverrides?.projects ?? null;

      return (
        <>
          <AudienceSwitcher
            role={sharedStateValue.role}
            onRoleChange={handleRoleChange}
            journalCount={journal.length}
            showSolutions={sharedStateValue.showSolutions}
            dataset={sharedStateValue.dataset}
          />
          {sharedStateValue.role === 'eleve' ? (
            <StudentApp
              showSolutions={sharedStateValue.showSolutions}
              onQueryExecuted={handleJournalPush}
              loggingEnabled={loggingEnabled}
              scenarioOverrides={scenarioOverrides}
              projectOverride={projectOverride}
              isFileProtocol={isFileProtocol}
              activeDataset={sharedStateValue.dataset}
            />
          ) : (
            <TeacherApp
              showSolutions={sharedStateValue.showSolutions}
              onShowSolutionsChange={handleShowSolutionsChange}
              loggingEnabled={loggingEnabled}
              setLoggingEnabled={setLoggingEnabled}
              journal={journal}
              setJournal={setJournal}
              solutionOverrides={solutionOverrides}
              setSolutionOverrides={setSolutionOverrides}
              isFileProtocol={isFileProtocol}
              activeDataset={sharedStateValue.dataset}
              onDatasetChange={handleDatasetChange}
              sharedStateSnapshot={sharedStateValue}
            />
          )}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<StandaloneApp />);
  </script>
</body>

</html>
