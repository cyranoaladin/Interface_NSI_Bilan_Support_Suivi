services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: nsi
      # Le mot de passe est défini mais ne sera pas utilisé pour les connexions internes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: nsi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # LIGNE CRUCIALE : Force le mode "trust" pour toutes les connexions
      - ./postgres/override-pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nsi", "-d", "nsi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nsi_network

  pgbouncer:
    image: bitnami/pgbouncer:1
    ports:
      - "6432:5432"
    environment:
      - PGBOUNCER_DATABASE=nsi
      - PGBOUNCER_USERNAME=nsi
      - PGBOUNCER_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_AUTH_TYPE=trust
      - PGBOUNCER_AUTH_USER=nsi
      - PGBOUNCER_AUTH_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=500
      - PGBOUNCER_DEFAULT_POOL_SIZE=50
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_USERNAME=nsi
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_started
    networks:
      - nsi_network

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nsi_network

  minio:
    image: minio/minio:latest
    env_file: ../.env
    environment:
      # Use defaults if not provided via shell env to avoid blank values
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    networks:
      - nsi_network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        APP_BASE_URL: ${APP_BASE_URL}
        NEXT_BASE_PATH: ${NEXT_BASE_PATH}
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      NEXT_BASE_PATH: ""
      SKIP_ENV_VALIDATION: "1"
      CI: "false"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-reports}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      TEST_FASTPATH_DELAY_MS: ${TEST_FASTPATH_DELAY_MS:-6000}
    ports:
      - "3000:3000"
    volumes:
      - ragdata:/data/rag_uploads
      - ..:/app
      - /home/alaeddine/Interface_NSI_2025_2026_local/data/rag_sources:/mnt/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nsi_network

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: ../.env
    environment:
      SKIP_ENV_VALIDATION: "1"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-reports}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      NODE_OPTIONS: --max-old-space-size=4096
      PRODUCTION_STRICT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      pgbouncer:
        condition: service_started
    volumes:
      - ragdata:/data/rag_uploads
      - ..:/app
    networks:
      - nsi_network

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web
    networks:
      - nsi_network

  grafana:
    image: grafana/grafana:10.4.6
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
    networks:
      - nsi_network

volumes:
  pgdata:
  minio:
  ragdata:
  prometheus_data:
  grafana_data:

networks:
  nsi_network:
    driver: bridge
